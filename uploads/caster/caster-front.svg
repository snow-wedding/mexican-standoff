<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <!-- Default caster card front: studio microphone with broadcast waves -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="75%">
      <stop offset="0" stop-color="#3a2f55"/>
      <stop offset=".55" stop-color="#17121f"/>
      <stop offset="1" stop-color="#0a0810"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d6880"/>
      <stop offset=".35" stop-color="#e9e6f2"/>
      <stop offset=".6" stop-color="#a7a2b8"/>
      <stop offset="1" stop-color="#4b465a"/>
    </linearGradient>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1d1828"/>
      <circle cx="5" cy="5" r="2.6" fill="#8a84a0"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a7a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff5a7a"/>
      <stop offset="1" stop-color="#ff5a7a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#c9b6ff" stroke-linecap="round">
    <path d="M150 120 A130 130 0 0 0 150 320" stroke-width="6" opacity=".55"/>
    <path d="M110 85 A180 180 0 0 0 110 355" stroke-width="5" opacity=".35"/>
    <path d="M70 50 A230 230 0 0 0 70 390" stroke-width="4" opacity=".2"/>
    <path d="M350 120 A130 130 0 0 1 350 320" stroke-width="6" opacity=".55"/>
    <path d="M390 85 A180 180 0 0 1 390 355" stroke-width="5" opacity=".35"/>
    <path d="M430 50 A230 230 0 0 1 430 390" stroke-width="4" opacity=".2"/>
  </g>
  <!-- mic head -->
  <rect x="190" y="70" width="120" height="200" rx="60" fill="url(#mesh)" stroke="url(#metal)" stroke-width="10"/>
  <rect x="186" y="170" width="128" height="18" rx="4" fill="url(#metal)"/>
  <circle cx="250" cy="179" r="5" fill="#ff5a7a"/>
  <!-- yoke + stand -->
  <path d="M168 190 v30 a82 82 0 0 0 164 0 v-30" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
  <rect x="242" y="300" width="16" height="120" fill="url(#metal)"/>
  <rect x="190" y="416" width="120" height="16" rx="8" fill="url(#metal)"/>
  <rect x="40" y="470" width="420" height="4" fill="url(#wave)" opacity=".8"/>
</svg>

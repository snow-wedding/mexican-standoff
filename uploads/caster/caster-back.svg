<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <!-- Default caster card back: headset, audio waveform and ON AIR light -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2140"/>
      <stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e6f2"/>
      <stop offset=".5" stop-color="#8f8aa3"/>
      <stop offset="1" stop-color="#4b465a"/>
    </linearGradient>
    <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <rect width="22" height="22" fill="none"/>
      <rect width="2" height="22" fill="#ffffff" opacity=".04"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a7a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5a7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="url(#bg)"/>
  <rect width="500" height="600" fill="url(#stripes)"/>
  <!-- ON AIR light -->
  <ellipse cx="250" cy="74" rx="130" ry="50" fill="url(#glow)"/>
  <rect x="170" y="48" width="160" height="52" rx="10" fill="#1a0d14" stroke="#ff5a7a" stroke-width="4"/>
  <text x="250" y="85" text-anchor="middle" font-family="Oxanium, Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="6" fill="#ff8da3">ON AIR</text>
  <!-- headset -->
  <path d="M140 300 v-30 a110 110 0 0 1 220 0 v30" fill="none" stroke="url(#metal)" stroke-width="16" stroke-linecap="round"/>
  <rect x="112" y="268" width="56" height="98" rx="22" fill="#1d1828" stroke="url(#metal)" stroke-width="8"/>
  <rect x="332" y="268" width="56" height="98" rx="22" fill="#1d1828" stroke="url(#metal)" stroke-width="8"/>
  <path d="M140 362 q0 64 80 70" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
  <rect x="214" y="420" width="38" height="22" rx="11" fill="#c9b6ff"/>
  <!-- waveform -->
  <g fill="#c9b6ff">
    <rect x="70" y="497" width="10" height="16" rx="5" opacity=".35"/>
    <rect x="92" y="487" width="10" height="36" rx="5" opacity=".5"/>
    <rect x="114" y="475" width="10" height="60" rx="5" opacity=".65"/>
    <rect x="136" y="490" width="10" height="30" rx="5" opacity=".5"/>
    <rect x="158" y="468" width="10" height="74" rx="5" opacity=".8"/>
    <rect x="180" y="482" width="10" height="46" rx="5" opacity=".7"/>
    <rect x="202" y="460" width="10" height="90" rx="5"/>
    <rect x="224" y="476" width="10" height="58" rx="5" opacity=".85"/>
    <rect x="246" y="455" width="10" height="100" rx="5"/>
    <rect x="268" y="476" width="10" height="58" rx="5" opacity=".85"/>
    <rect x="290" y="460" width="10" height="90" rx="5"/>
    <rect x="312" y="482" width="10" height="46" rx="5" opacity=".7"/>
    <rect x="334" y="468" width="10" height="74" rx="5" opacity=".8"/>
    <rect x="356" y="490" width="10" height="30" rx="5" opacity=".5"/>
    <rect x="378" y="475" width="10" height="60" rx="5" opacity=".65"/>
    <rect x="400" y="487" width="10" height="36" rx="5" opacity=".5"/>
    <rect x="422" y="497" width="10" height="16" rx="5" opacity=".35"/>
  </g>
</svg>
